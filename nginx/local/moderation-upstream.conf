# Local dev: one moderation replica behind the same moderation-lb name the
# Nakama chat module hardcodes. Five ~3GB model processes don't fit on a dev
# machine that is also running game clients. Prod uses nginx/moderation-upstream.conf.
upstream moderation_pool {
	server moderation-1:8001;
}

server {
	listen 8001;

	location / {
		proxy_pass http://moderation_pool;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_connect_timeout 2s;
		proxy_read_timeout 10s;
	}
}
