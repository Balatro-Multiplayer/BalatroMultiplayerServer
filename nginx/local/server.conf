# Local dev's server block for the `nginx` service -- swapped in by
# docker-compose.local.yml in place of nginx/prod/server.conf (no TLS, no
# domain, no Cloudflare -- just the same blue/green proxy_pass real clients
# hit at 127.0.0.1:8788, same as prod's /api/ location). `upstream.conf`
# (mounted from the shared nginx/ directory, not this one) is the only file
# scripts/deploy-color-swap.sh ever rewrites in either environment.
server {
	listen 8788;

	location / {
		proxy_pass http://bmp_api_active;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection "";
	}
}
