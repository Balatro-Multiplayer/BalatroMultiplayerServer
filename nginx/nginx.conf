# The main nginx config for `nginx` and `moderation-lb` (docker-compose.yml
# mounts it over the image's own). It is the nginx:1.27-alpine default with
# two changes, for the Notice:
# - the error log, which keeps client addresses, goes to a file on a tmpfs
#   (gone when the container stops), not to Docker's log. rotate-error-log.sh
#   deletes every line of it before it is 7 days old.
# - no access log at http level: each server block writes its own with the
#   no_client_ip format (snippets/log-format.conf).
user nginx;
worker_processes auto;

error_log /var/log/nginx/errors/error.log notice;
pid /var/run/nginx.pid;

events {
	worker_connections 1024;
}

http {
	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	access_log off;

	sendfile on;
	keepalive_timeout 65;

	include /etc/nginx/conf.d/*.conf;
}
