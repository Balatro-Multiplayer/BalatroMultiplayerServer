# Round-robins across the 5 moderation-service replicas (see
# docker-compose.yml's moderation-1..5 + moderation-lb) -- each replica is
# one process with exactly one node-llama-cpp RankingContext and no
# in-process concurrency of its own (apps/moderation/README.md has the full
# writeup on why 5 processes beat one bigger one). max_fails/fail_timeout
# gives basic passive failover: a replica that errors/times out 3 times in
# 10s gets skipped for the next 10s, same defaults nginx would use anywhere
# else.
# Internal-only, plain HTTP, no TLS -- moderation-lb is not published to the
# host, only api-blue/api-green (MODERATION_SERVICE_URL) ever call it.
upstream moderation_pool {
	server moderation-1:8001 max_fails=3 fail_timeout=10s;
	server moderation-2:8001 max_fails=3 fail_timeout=10s;
	server moderation-3:8001 max_fails=3 fail_timeout=10s;
	server moderation-4:8001 max_fails=3 fail_timeout=10s;
	server moderation-5:8001 max_fails=3 fail_timeout=10s;
}

server {
	listen 8001;

	location / {
		proxy_pass http://moderation_pool;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_connect_timeout 2s;
		proxy_read_timeout 10s;
	}
}
