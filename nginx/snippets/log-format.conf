# The access log format for every server in this repo's nginx config. It
# leaves out the client's address (and the query string, which can carry a
# login token): the Notice says we do not store plain IP addresses. Include it
# once at the top of a conf.d file (http context), then give each server block
# `access_log /var/log/nginx/access.log no_client_ip;` (a server-level
# access_log replaces the image's default one, which logs $remote_addr).
log_format no_client_ip '$time_iso8601 $host "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time';
