# Dockerized replacement for bmpserver's old host-level
# /etc/nginx/sites-available/bmp -- same routing/TLS/Cloudflare behavior,
# just running as the `nginx` service in docker-compose.yml instead of a
# separate systemd-managed nginx install, so all server config lives in one
# place. upstream.conf (this same conf.d/ directory) is the only file
# scripts/deploy-color-swap.sh ever rewrites.
# Internal-only, plain HTTP, no TLS -- EMQX's webhook/authn calls
# (cluster.hocon, emqx-provision.service.ts) and web's server-side
# API_SERVER_URL are both still hardcoded to "http://api:8788" and were
# never changed; this is what actually answers that address now (routed via
# the `api` network alias on the `nginx` service, see docker-compose.yml).
# Not published to the host -- only reachable from other containers on the
# bmp network.
server {
	listen 8788;

	location / {
		proxy_pass http://bmp_api_active;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection "";
	}
}

server {
	listen 80;
	listen [::]:80;
	server_name new.balatromp.com;
	return 301 https://$host$request_uri;
}

# Mirrors the old host-nginx "mqtt-acme" site exactly -- certbot's webroot
# authenticator for mqtt.balatromp.com's Let's Encrypt cert (renewed via
# certbot.timer, see /etc/letsencrypt/renewal-hooks/deploy/reload-emqx.sh)
# drops its HTTP-01 challenge file in /var/www/certbot on the host and
# expects *something* on port 80 to serve it back over plain HTTP. Nothing
# else here answers for mqtt.balatromp.com at all - EMQX terminates its own
# TLS directly from the copied cert files, this block's only job is keeping
# that renewal working now that this container (not host nginx) owns port 80.
server {
	listen 80;
	listen [::]:80;
	server_name mqtt.balatromp.com;

	location /.well-known/acme-challenge/ {
		root /var/www/certbot;
	}

	location / {
		return 404;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name new.balatromp.com;

	ssl_certificate /etc/nginx/ssl/bmp.crt;
	ssl_certificate_key /etc/nginx/ssl/bmp.key;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers HIGH:!aNULL:!MD5;

	include /etc/nginx/snippets/cloudflare-realip.conf;

	client_max_body_size 350M;

	# Next.js proxy routes (must come before /api/)
	location /api/proxy/ {
		proxy_pass http://web:3000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $http_cf_connecting_ip;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
	}

	# Backend API (game clients) -- bmp_api_active tracks whichever color is
	# live, see upstream.conf.
	location /api/ {
		proxy_pass http://bmp_api_active;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $http_cf_connecting_ip;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
	}

	# Web app (Next.js)
	location / {
		proxy_pass http://web:3000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $http_cf_connecting_ip;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection 'upgrade';
	}
}
