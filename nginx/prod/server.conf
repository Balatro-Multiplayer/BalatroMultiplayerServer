# Dockerized replacement for the prod host's old host-level
# /etc/nginx/sites-available/bmp -- same routing/TLS/Cloudflare behavior,
# just running as the `nginx` service in docker-compose.yml instead of a
# separate systemd-managed nginx install, so all server config lives in one
# place. upstream.conf (this same conf.d/ directory) is the only file
# scripts/deploy-color-swap.sh ever rewrites.
# Internal-only, plain HTTP, no TLS -- Nakama's /internal/nakama/* calls
# (EXPRESS_INTERNAL_URL) and web's server-side API_SERVER_URL; this is what
# answers "http://api:8788" / "http://nginx:8788" (routed via the `api`
# network alias on the `nginx` service, see docker-compose.yml).
# Not published to the host -- only reachable from other containers on the
# bmp network.
# "upgrade" for a websocket handshake, "close" otherwise.
map $http_upgrade $connection_upgrade {
	default upgrade;
	'' close;
}

server {
	listen 8788;

	location / {
		proxy_pass http://bmp_api_active;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Connection "";
	}
}

server {
	listen 80;
	listen [::]:80;
	server_name new.balatromp.com nakama.balatromp.com;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name new.balatromp.com;

	ssl_certificate /etc/nginx/ssl/bmp.crt;
	ssl_certificate_key /etc/nginx/ssl/bmp.key;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers HIGH:!aNULL:!MD5;

	include /etc/nginx/snippets/cloudflare-realip.conf;

	client_max_body_size 350M;

	# Next.js proxy routes (must come before /api/)
	location /api/proxy/ {
		proxy_pass http://web:3000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $http_cf_connecting_ip;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
	}

	# Backend API (website and webadmin) -- bmp_api_active tracks whichever color is
	# live, see upstream.conf.
	location /api/ {
		proxy_pass http://bmp_api_active;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $http_cf_connecting_ip;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
	}

	# Web app (Next.js)
	location / {
		proxy_pass http://web:3000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $http_cf_connecting_ip;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection 'upgrade';
	}
}

# The game backend: Nakama's HTTP API and its realtime websocket (/ws), both
# on 7350. Game clients connect here (MPAPI SERVER_DEFAULTS: port 443,
# secure). The console (7351) is not exposed; reach it over an SSH tunnel.
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name nakama.balatromp.com;

	ssl_certificate /etc/nginx/ssl/bmp.crt;
	ssl_certificate_key /etc/nginx/ssl/bmp.key;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers HIGH:!aNULL:!MD5;

	include /etc/nginx/snippets/cloudflare-realip.conf;

	location / {
		proxy_pass http://nakama:7350;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $http_cf_connecting_ip;
		# Nakama takes the player's IP (ctx.clientIp, used by network bans)
		# from the first X-Forwarded-For entry. A client can put any value
		# first in the header it sends, so replace the header with the one
		# address real_ip restored: CF-Connecting-IP when the request came
		# through Cloudflare, else the direct peer.
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		# A lobby socket can sit quiet between turns; Nakama pings it well
		# inside this.
		proxy_read_timeout 1h;
		proxy_send_timeout 1h;
	}
}
