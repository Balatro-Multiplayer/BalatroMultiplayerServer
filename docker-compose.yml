# STAFF compose. Service name + host port (8799) match the live staff container
# (staff-server-staff-socket-1) so `docker compose up` recreates it in place
# instead of orphaning it. Host 8788 is PRODUCTION's port — never bind it here.
# Same image/code as the casjb/log-hash-store feature branch; only the service
# name, published port and (added) ./data volume differ from prod.
services:
  staff-socket:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8799:8788"
    environment:
      NODE_ENV: development
      # Replay-log hash store (better-sqlite3). Lives on the ./data volume so it
      # survives container redeploys. This is the STAFF DB, fully separate from
      # prod's (each is a per-directory ./data bind mount).
      LOG_HASH_DB_PATH: /data/log_hashes.db
    restart: unless-stopped
    # Container stdout/stderr rotation is handled host-side by logrotate
    # (deploy/logrotate/balatro-docker: daily, compress after 1 day, keep 30
    # days). We deliberately leave the json-file driver at its default here so
    # Docker doesn't also rotate the same files and collide with logrotate.
    volumes:
      - ./logs:/logs
      - ./data:/data
