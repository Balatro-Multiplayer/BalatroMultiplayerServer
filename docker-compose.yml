services:
  emqx:
    image: emqx/emqx:5.8
    container_name: bmp-emqx
    ports:
      - "8883:8883"
      # Plain MQTT for local dev clients (custom_server_secure=false -> port 1883).
      - "1883:1883"
    environment:
      EMQX_NAME: bmp-emqx
    volumes:
      - ./apps/server/emqx/cluster.hocon:/opt/emqx/etc/cluster.hocon:ro
      # Let's Encrypt cert for mqtt.balatromp.com, copied out of /etc/letsencrypt
      # (root-only permissions there aren't readable by the non-root emqx
      # container user) by /etc/letsencrypt/renewal-hooks/deploy/reload-emqx.sh,
      # which also restarts this container on renewal.
      - /root/emqx-certs/mqtt.balatromp.com:/opt/emqx/etc/certs:ro
      - emqx-data:/opt/emqx/data
      - emqx-log:/opt/emqx/log
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - bmp

  postgres:
    image: postgres:16-alpine
    container_name: bmp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bmp
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - bmp

  # api-blue/api-green: the blue-green pair (scripts/deploy-color-swap.sh).
  # Neither publishes a host port or is reachable as plain "api" on the bmp
  # network -- the `nginx` service below is the only stable address, for
  # both external traffic (published 80/443 in prod, 127.0.0.1:8788 for
  # local dev -- see docker-compose.local.yml) and EMQX's own webhook/authn
  # calls (which are hardcoded to "http://api:8788" in
  # cluster.hocon/emqx-provision.service.ts and were never changed -- nginx
  # just took over that identity via a network alias, so EMQX never needs to
  # know a swap happened at all).
  api-blue: &api-color
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: bmp-api-blue
    env_file: ./apps/server/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bmp
      EMQX_BROKER_URL: mqtt://emqx:1883
      EMQX_API_URL: http://emqx:18083/api/v5
      WEB_BASE_URL: ${WEB_BASE_URL:-https://new.balatromp.com}
    depends_on:
      emqx:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      # node's global fetch (no curl/wget in node:22-alpine) against the
      # existing /health endpoint (main.ts) -- previously unused by anything,
      # including this service's own depends_on/restart-readiness.
      test: ["CMD", "node", "-e", "fetch('http://localhost:8788/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - bmp

  api-green:
    <<: *api-color
    container_name: bmp-api-green

  # The ONLY reverse proxy for this whole stack -- replaces what used to be
  # a separately hand-maintained host-level nginx install on bmpserver
  # (/etc/nginx/sites-available/bmp), so all server config, TLS included,
  # lives in this repo/compose file instead of split across two places.
  # nginx/prod/server.conf is the prod-realistic default (TLS, Cloudflare,
  # web/api routing, matching the old host config exactly);
  # docker-compose.local.yml swaps in nginx/local/server.conf (plain HTTP,
  # no domain) for local dev. nginx/upstream.conf is the one file
  # scripts/deploy-color-swap.sh ever rewrites, in either environment.
  nginx:
    image: nginx:1.27-alpine
    container_name: bmp-nginx
    networks:
      bmp:
        aliases:
          - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod/server.conf:/etc/nginx/conf.d/server.conf:ro
      - ./nginx/upstream.conf:/etc/nginx/conf.d/upstream.conf
      - ./nginx/snippets:/etc/nginx/snippets:ro
      # Self-signed, 10-year cert for new.balatromp.com (confirmed via
      # `openssl x509` - issuer == subject) - NOT a Cloudflare Origin CA
      # cert despite what an earlier version of this comment claimed. Works
      # today because the Cloudflare zone's SSL/TLS mode is "Full", not
      # "Full (strict)" (which would reject an untrusted origin cert
      # outright) - if that mode is ever tightened, this needs a real
      # Origin CA cert first. Long-lived either way, no certbot/renewal
      # hook needed (unlike EMQX's mqtt.balatromp.com cert below, which is
      # real Let's Encrypt and does renew - see the certbot mount below).
      - /etc/nginx/ssl/bmp.crt:/etc/nginx/ssl/bmp.crt:ro
      - /etc/nginx/ssl/bmp.key:/etc/nginx/ssl/bmp.key:ro
      # certbot's webroot HTTP-01 authenticator for mqtt.balatromp.com
      # drops its challenge file here; nginx/prod/server.conf's
      # mqtt.balatromp.com server block serves it back. Read-only - only
      # certbot itself (running on the host, outside this container) ever
      # writes here.
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      api-green:
        condition: service_started
    healthcheck:
      # Generous start_period -- this proxies straight through to whichever
      # api color is currently starting, so it can't become healthy any
      # faster than that color's own app boot (mods-sync alone can take
      # several seconds). --no-check-certificate: this healthcheck runs
      # inside the container without the host's CA trust store; the cert
      # itself is real and valid for real external clients.
      test: ["CMD", "wget", "-q", "--no-check-certificate", "--spider", "https://localhost/health"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 45s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: bmp-web
    environment:
      NODE_ENV: production
      API_SERVER_URL: http://api:8788
    depends_on:
      nginx:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bmp

networks:
  bmp:
    name: bmp

volumes:
  emqx-data:
  emqx-log:
  pg-data:
