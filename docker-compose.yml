services:
  postgres:
    image: postgres:16-alpine
    container_name: bmp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bmp
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - bmp

  # The game backend. Game clients reach it at nakama.balatromp.com through
  # nginx (HTTP and the websocket on 7350); the API drives it over the
  # compose network. Its data lives in a separate "nakama" database on the
  # shared Postgres server; `migrate up` creates it on first start. Secrets
  # come from the root .env -- the entrypoint refuses to start without them.
  # compose.local.yml (Community and Dev servers) runs it with local.yml.
  nakama:
    image: heroiclabs/nakama:3.41.0
    container_name: bmp-nakama
    # Longer than prod.yml's shutdown_grace_sec, so lobbies get to checkpoint.
    stop_grace_period: 30s
    entrypoint:
      - /bin/sh
      - -ec
      - |
        db="postgres:postgres@postgres:5432/nakama"
        /nakama/nakama migrate up --database.address "$$db"
        exec /nakama/nakama --config /nakama/data/prod.yml \
          --database.address "$$db" \
          --socket.server_key "$${NAKAMA_SERVER_KEY:?}" \
          --session.encryption_key "$${NAKAMA_SESSION_KEY:?}" \
          --session.refresh_encryption_key "$${NAKAMA_REFRESH_KEY:?}" \
          --runtime.http_key "$${NAKAMA_HTTP_KEY:?}" \
          --console.username admin \
          --console.password "$${NAKAMA_CONSOLE_PASSWORD:?}" \
          --console.signing_key "$${NAKAMA_CONSOLE_SIGNING_KEY:?}" \
          --runtime.env "BMP_SERVER_KIND=$$BMP_SERVER_KIND" \
          --runtime.env "ALLOW_DEVICE_AUTH=$$ALLOW_DEVICE_AUTH" \
          --runtime.env "ALLOW_RANKED_LOBBIES=$$ALLOW_RANKED_LOBBIES" \
          --runtime.env "STEAM_APP_ID=$$STEAM_APP_ID" \
          --runtime.env "STEAM_WEB_API_KEY=$${STEAM_WEB_API_KEY:?}" \
          --runtime.env "PLAYER_ID_SALT=$${PLAYER_ID_SALT:?}" \
          --runtime.env "IP_HASH_SALT=$${IP_HASH_SALT:?}" \
          --runtime.env "MODERATION_BEARER_TOKEN=$$MODERATION_BEARER_TOKEN" \
          --runtime.env "MODERATION_REMOTE=$$MODERATION_REMOTE" \
          --runtime.env "EXPRESS_INTERNAL_URL=http://nginx:8788" \
          --runtime.env "EXPRESS_INTERNAL_KEY=$${INTERNAL_API_KEY:?}"
    environment:
      # This is the Official server: Steam login only. Nakama refuses to
      # start if a dev flag (passed through below so a stray one is seen)
      # is on. See packages/types/src/server-kind.ts.
      BMP_SERVER_KIND: official
      ALLOW_DEVICE_AUTH: ${ALLOW_DEVICE_AUTH:-}
      ALLOW_RANKED_LOBBIES: ${ALLOW_RANKED_LOBBIES:-}
      STEAM_APP_ID: ${STEAM_APP_ID:-2379780}
      STEAM_WEB_API_KEY: ${STEAM_WEB_API_KEY:-}
      # Same salt as the API's, so a login's Steam id hashes to the key the
      # legacy ratings import parked its ratings under.
      PLAYER_ID_SALT: ${PLAYER_ID_SALT:-}
      # Hashes the networks players log in from, for network bans (ADR 0005).
      # Its own secret, never shared with the API; set it once, never change it.
      IP_HASH_SALT: ${IP_HASH_SALT:-}
      # The client ships this (MPAPI api/connection/lifecycle.lua
      # SERVER_DEFAULTS.server_key), so the two must match.
      NAKAMA_SERVER_KEY: ${NAKAMA_SERVER_KEY:-defaultkey}
      NAKAMA_SESSION_KEY: ${NAKAMA_SESSION_KEY:-}
      NAKAMA_REFRESH_KEY: ${NAKAMA_REFRESH_KEY:-}
      NAKAMA_HTTP_KEY: ${NAKAMA_HTTP_KEY:-}
      NAKAMA_CONSOLE_PASSWORD: ${NAKAMA_CONSOLE_PASSWORD:-}
      NAKAMA_CONSOLE_SIGNING_KEY: ${NAKAMA_CONSOLE_SIGNING_KEY:-}
      # What Nakama sends on the API's /internal/nakama/* routes (through
      # nginx, so a blue/green swap is invisible here).
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      # Chat is judged by moderation-lb (hardcoded in nakama/src/chat). It
      # must be up, or chat fails closed. The model enforces here
      # (SHADOW_MODE defaults to 0 below), so a missing model refuses every
      # message. "off" judges chat with the local word filter
      # (nakama/src/chat/filter.ts) instead.
      MODERATION_BEARER_TOKEN: ${MODERATION_BEARER_TOKEN:-}
      MODERATION_REMOTE: ${MODERATION_REMOTE:-on}
    volumes:
      - ./nakama/prod.yml:/nakama/data/prod.yml:ro
      - ./nakama/modules:/nakama/data/modules:ro
    ports:
      # The console, for an SSH tunnel only.
      - "127.0.0.1:7351:7351"
    depends_on:
      postgres:
        condition: service_healthy
      moderation-lb:
        condition: service_started
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      - bmp

  # api-blue/api-green: the blue-green pair (scripts/deploy-color-swap.sh).
  # Neither publishes a host port or is reachable as plain "api" on the bmp
  # network -- the `nginx` service below is the only stable address, for
  # external traffic (published 80/443), web's server-side calls and Nakama's
  # /internal/nakama/* calls, all through the "api" network alias.
  api-blue: &api-color
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: bmp-api-blue
    env_file: ./apps/server/.env
    environment:
      # The Official server: the API refuses to start with a dev flag on.
      BMP_SERVER_KIND: official
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/bmp
      WEB_BASE_URL: ${WEB_BASE_URL:-https://new.balatromp.com}
      # The API mirrors Nakama's games into Postgres and drives it through
      # its server-only admin RPCs (NAKAMA_HTTP_KEY = Nakama's
      # runtime.http_key); INTERNAL_API_KEY guards /internal/nakama/*.
      NAKAMA_URL: http://nakama:7350
      NAKAMA_HTTP_KEY: ${NAKAMA_HTTP_KEY:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      ARCHIVE_DIR: /app/archives
    volumes:
      # Read-only bind mount of manually-populated Discord channel archive
      # bundles (features/webadmin/archives.route.ts) -- ARCHIVE_DIR on the
      # host defaults to /opt/bmp/archives; override in the root .env if the
      # deploy host uses a different path. This app never writes here.
      - ${ARCHIVE_DIR:-/opt/bmp/archives}:/app/archives:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # node's global fetch (no curl/wget in node:22-alpine) against the
      # existing /health endpoint (main.ts) -- previously unused by anything,
      # including this service's own depends_on/restart-readiness.
      test: ["CMD", "node", "-e", "fetch('http://localhost:8788/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    networks:
      - bmp

  api-green:
    <<: *api-color
    container_name: bmp-api-green

  # Five independent moderation-service processes behind moderation-lb below,
  # rather than one instance with more threads: the classifier
  # (guard/rankEngine.ts) has no in-process concurrency of its own -- one
  # process gets one node-llama-cpp RankingContext, and JudgeLane only sheds
  # requests it can't meet the deadline for, it doesn't queue/parallelize
  # them. Benchmarked live (EPYC 9645, 12 vCPU): 5x GUARD_THREADS=2 measured
  # 6.50 msg/sec aggregate vs. 4.15 msg/sec for one GUARD_THREADS=10
  # instance. See apps/moderation/README.md for the full writeup.
  moderation-1: &moderation-replica
    build:
      context: .
      dockerfile: apps/moderation/Dockerfile
    container_name: bmp-moderation-1
    # No host port: only moderation-lb talks to these, over the compose network.
    environment:
      # The model enforces (the Notice says chat may be blocked). Set 1 to
      # only log what it WOULD block.
      SHADOW_MODE: ${SHADOW_MODE:-0}
      GUARD_THREADS: ${MODERATION_GUARD_THREADS:-2}
      GUARD_LOW_THRESHOLD: ${MODERATION_GUARD_LOW_THRESHOLD:-0.35}
      GUARD_HIGH_THRESHOLD: ${MODERATION_GUARD_HIGH_THRESHOLD:-0.8}
      MODERATION_BEARER_TOKEN: ${MODERATION_BEARER_TOKEN:-}
    volumes:
      # The GGUF is not in the image. Drop it here (once -- shared by all 5
      # replicas) and each service finds it at the path baked into the
      # Dockerfile. See apps/moderation/README.md for the quantize-then-stage
      # steps and why 5 processes safely mmap the same file without 5x RAM.
      - moderation-model-cache:/model-cache
    restart: unless-stopped
    networks:
      - bmp

  moderation-2:
    <<: *moderation-replica
    container_name: bmp-moderation-2

  moderation-3:
    <<: *moderation-replica
    container_name: bmp-moderation-3

  moderation-4:
    <<: *moderation-replica
    container_name: bmp-moderation-4

  moderation-5:
    <<: *moderation-replica
    container_name: bmp-moderation-5

  # Round-robins across the 5 replicas above (nginx/moderation-upstream.conf),
  # with passive failover (max_fails/fail_timeout) if one goes unhealthy.
  # Internal-only, no TLS, no host port -- Nakama's chat is the only caller.
  moderation-lb:
    image: nginx:1.27-alpine
    container_name: bmp-moderation-lb
    volumes:
      - ./nginx/moderation-upstream.conf:/etc/nginx/conf.d/moderation-upstream.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    depends_on:
      - moderation-1
      - moderation-2
      - moderation-3
      - moderation-4
      - moderation-5
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - bmp

  # The ONLY reverse proxy for this whole stack -- replaces what used to be
  # a separately hand-maintained host-level nginx install on the prod host
  # (/etc/nginx/sites-available/bmp), so all server config, TLS included,
  # lives in this repo/compose file instead of split across two places.
  # nginx/prod/server.conf is the prod-realistic default (TLS, Cloudflare,
  # web/api routing, matching the old host config exactly).
  # nginx/upstream.conf is the one file scripts/deploy-color-swap.sh ever
  # rewrites.
  nginx:
    image: nginx:1.27-alpine
    container_name: bmp-nginx
    networks:
      bmp:
        aliases:
          - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod/server.conf:/etc/nginx/conf.d/server.conf:ro
      - ./nginx/upstream.conf:/etc/nginx/conf.d/upstream.conf
      - ./nginx/snippets:/etc/nginx/snippets:ro
      # Self-signed, 10-year cert for new.balatromp.com (confirmed via
      # `openssl x509` - issuer == subject) - NOT a Cloudflare Origin CA
      # cert despite what an earlier version of this comment claimed. Works
      # today because the Cloudflare zone's SSL/TLS mode is "Full", not
      # "Full (strict)" (which would reject an untrusted origin cert
      # outright) - if that mode is ever tightened, this needs a real
      # Origin CA cert first. Long-lived either way, no certbot/renewal
      # hook needed. nakama.balatromp.com is served with the same cert,
      # which "Full" mode accepts just as well.
      - /etc/nginx/ssl/bmp.crt:/etc/nginx/ssl/bmp.crt:ro
      - /etc/nginx/ssl/bmp.key:/etc/nginx/ssl/bmp.key:ro
    depends_on:
      api-green:
        condition: service_started
      nakama:
        condition: service_started
    healthcheck:
      # Generous start_period -- this proxies straight through to whichever
      # api color is currently starting, so it can't become healthy any
      # faster than that color's own app boot. Hits the internal :8788
      # listener (server.conf's first server block - the same one Nakama/web
      # use via the "api" network alias), not the public :443 vhost - the
      # public vhost's bare "/health" (no /api/ prefix) falls through to
      # location / (the web app, which has no such route -> 404), and only
      # ever answers "/api/health" for API concerns anyway, which the app itself
      # doesn't register (its real /health route is unprefixed - see
      # main.ts). Plain http, not https - :8788 is internal-only, no TLS.
      # 127.0.0.1 explicitly, not "localhost" - this image resolves
      # localhost to ::1 first and there's no [::]:8788 listener (the
      # :8788 server block, unlike the others, has no "listen [::]:8788;"
      # line), so wget's IPv6 attempt would just hang/refuse and never
      # fall back to IPv4 on its own.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8788/health"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 45s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: bmp-web
    environment:
      NODE_ENV: production
      API_SERVER_URL: http://api:8788
    depends_on:
      nginx:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - bmp

networks:
  bmp:
    name: bmp

volumes:
  pg-data:
  moderation-model-cache:
