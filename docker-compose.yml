# STAFF compose. Service name + host port (8799) match the live staff container
# (staff-server-staff-socket-1) so `docker compose up` recreates it in place
# instead of orphaning it. Host 8788 is PRODUCTION's port — never bind it here.
# Same image/code as the casjb/abuse-ratelimit-combined feature branch (live
# replay-log streaming + abuse rate/size limits + central hard-ban enforcement);
# only the service name, published port and ./data volume differ from prod.
services:
  staff-socket:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8799:8788"
    environment:
      NODE_ENV: development
      # Replay-log hash store (better-sqlite3). Lives on the ./data volume so it
      # survives container redeploys. This is the STAFF DB, fully separate from
      # prod's (each is a per-directory ./data bind mount). The watcher writes
      # central_hard_bans into this same file (see the staff ban-watcher).
      LOG_HASH_DB_PATH: /data/log_hashes.db
    restart: unless-stopped
    # Resource caps so an abuse spike that slips past the app-level limits OOM-kills
    # only this container (which then auto-restarts) instead of taking down the whole
    # shared host. Idle usage is ~120 MB; 512 MB leaves ample headroom for ~50 live
    # games. The box is 2 vCPU / ~2 GB shared across ~9 containers.
    mem_limit: 512m
    cpus: "1.5"
    pids_limit: 512
    # Container stdout/stderr rotation is handled host-side by logrotate
    # (deploy/logrotate/balatro-docker: daily, compress after 1 day, keep 30
    # days). We deliberately leave the json-file driver at its default here so
    # Docker doesn't also rotate the same files and collide with logrotate.
    volumes:
      - ./logs:/logs
      - ./data:/data
