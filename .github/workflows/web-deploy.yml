name: Web deploy

# Runs only by hand: Actions > Web deploy > Run workflow.
# Deploys the API and the website to the Official server. Nakama is not
# restarted and ranked stays open. If nakama/ differs from the server folder (a Web deploy never copies it),
# the run shows a warning and still deploys; run a Full deploy to apply it.
# Needs the secrets DEPLOY_SSH_KEY and DEPLOY_SSH_KNOWN_HOSTS and the
# variables DEPLOY_SSH_HOST and DEPLOY_SSH_USER.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to deploy
        required: false
        default: main

permissions:
  contents: read

# Shared with the Full deploy, so the two never run at the same time.
concurrency:
  group: official-server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_SSH_HOST: ${{ vars.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
    steps:
      - name: Resolve the ref to a full sha
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$REF" --jq .sha)
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve '$REF' to a commit sha"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Deploying $REF = $sha"

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
          cat > "$RUNNER_TEMP/ssh_config" <<CONF
          Host deploy-target
            HostName $DEPLOY_SSH_HOST
            User $DEPLOY_SSH_USER
            IdentityFile $RUNNER_TEMP/deploy_key
            IdentitiesOnly yes
            UserKnownHostsFile $RUNNER_TEMP/known_hosts
            StrictHostKeyChecking yes
            BatchMode yes
            ServerAliveInterval 30
          CONF

      - name: Status before
        run: ssh -F "$RUNNER_TEMP/ssh_config" deploy-target status

      - name: Deploy the API and the website
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        # bash -eo pipefail: a failed ssh must fail the step, not hide behind tee.
        shell: bash
        run: |
          ssh -F "$RUNNER_TEMP/ssh_config" deploy-target "web $SHA" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          {
            echo "### Web deploy $SHA"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          # The host warns when nakama/ changed; a Web deploy does not apply it.
          if grep -q 'WARNING: nakama/ changed' "$RUNNER_TEMP/deploy.log"; then
            echo "::warning::nakama/ changed since the last deploy. A Web deploy does not restart Nakama. Run a Full deploy to apply it."
            echo "Warning: nakama/ changed. Nakama was not restarted. Run a Full deploy to apply it." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No nakama/ change." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Status after
        shell: bash
        run: ssh -F "$RUNNER_TEMP/ssh_config" deploy-target status | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts" "$RUNNER_TEMP/ssh_config"
