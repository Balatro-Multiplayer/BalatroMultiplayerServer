# Nakama config for a deployed server (docker-compose.yml's `nakama`
# service). Nothing secret lives here: the database address, the session and
# console keys, runtime.http_key and every runtime.env value are passed as
# flags by docker-compose.yml from the root .env. local.yml is the local-dev
# counterpart.
name: bmp
data_dir: /nakama/data
# On shutdown, lobby matches get this long to checkpoint themselves (their
# matchTerminate) so they come back after the restart (lobby/checkpoint.ts).
# docker-compose.yml's stop_grace_period must outlast it.
shutdown_grace_sec: 20

logger:
  level: INFO
  stdout: true

session:
  # One websocket per session: a second socket closes the first.
  single_socket: true
  token_expiry_sec: 7200
  refresh_token_expiry_sec: 604800

socket:
  # Nakama's default (4096) closes a client's socket (1009) on any bigger
  # message, which a match_data_send carrying more than ~2.9KB of action
  # params already is (base64 + envelope). Room for lobby/relay.ts's own
  # MAX_PARAMS_BYTES (16KB) so its too_large refusal is what applies;
  # src/socket_limit.test.ts checks this against both configs.
  max_message_size_bytes: 32768

match:
  # Messages a match reads per tick. Nakama's default (128) silently drops the
  # rest ("Match handler data processing too slow"); a replay burst after a
  # scored hand or a flush after a drop can pass 128.
  # src/socket_limit.test.ts checks this against both configs.
  input_queue_size: 1024

runtime:
  # modules/index.js, built from ./src by build.mjs.
  path: /nakama/data/modules
  js_entrypoint: index.js

metrics:
  # Prometheus endpoint, for the Stats page's online player count: the API
  # reads the nakama_sessions gauge (open game sockets; a website login has
  # none) at NAKAMA_METRICS_URL. Reached over the compose network only;
  # docker-compose.yml never publishes this port to the host. Values reach
  # the endpoint every reporting_freq_sec (default 60), too slow for a
  # counter the page polls every 15 seconds.
  prometheus_port: 9100
  reporting_freq_sec: 5

matchmaker:
  interval_sec: 5
  max_tickets: 1000
