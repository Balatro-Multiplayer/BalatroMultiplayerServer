# Nakama config for Community and Dev servers (compose.local.yml's `nakama`
# service). Every key and password here is a public placeholder, and
# compose.local.yml passes each one again as a flag, so a host overrides them
# from the root .env. Never reuse this file for the Official server.
#
# The database address and runtime.env values (read by modules/index.js) are
# also flags from compose.local.yml.
name: bmp-local
data_dir: /nakama/data
# On shutdown, lobby matches get this long to checkpoint themselves (their
# matchTerminate) so they come back after the restart (lobby/checkpoint.ts).
# compose.local.yml's stop_grace_period must outlast it.
shutdown_grace_sec: 20

logger:
  level: INFO
  stdout: true

session:
  # One websocket per session: a second socket closes the first. The
  # mpapi:nakama_sdk ClaudeControl suite relies on this.
  single_socket: true
  token_expiry_sec: 7200
  refresh_token_expiry_sec: 604800
  encryption_key: local-dev-session-encryption-key
  refresh_encryption_key: local-dev-refresh-encryption-key

socket:
  # MPAPI's config.lua uses the same value (nakama_server_key).
  server_key: defaultkey
  # Nakama's default (4096) closes a client's socket (1009) on any bigger
  # message, which a match_data_send carrying more than ~2.9KB of action
  # params already is (base64 + envelope). Room for lobby/relay.ts's own
  # MAX_PARAMS_BYTES (16KB) so its too_large refusal is what applies;
  # src/socket_limit.test.ts checks this against both configs.
  max_message_size_bytes: 32768

runtime:
  http_key: local-dev-http-key
  # modules/index.js (built from ../src by build.mjs): Steam login through a
  # before-hook on custom auth, plus the bmp_lobby match and lobby RPCs.
  path: /nakama/data/modules
  js_entrypoint: index.js
  # No QUEUE_ALLOWED_MOD_IDS_EXTRA: a Community or Dev server lets any mod
  # queue (standing/current.ts), so the allowed mods are checked only on the
  # Official server.

console:
  username: admin
  password: localdevpassword
  signing_key: local-dev-console-signing-key

matchmaker:
  # Default is 15s between matching passes; local tests shouldn't wait that long.
  interval_sec: 2
  max_tickets: 3
